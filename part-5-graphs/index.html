<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Algorithms - DSA Practical Guide</title>
  <link href="../../assets/css/main.css" rel="stylesheet">
  <link href="../../assets/css/simulation-base.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
  <!-- Header Bar -->
  <header class="topbar">
    <div class="page-title">
      <i class="fa-solid fa-diagram-project text-primary me-2"></i> Part 5: Graph Algorithms &nbsp;›&nbsp; BFS, DFS & Dijkstra
    </div>
    <div class="topbar-right d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm" id="audioToggle" title="Mute Sound">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <a href="../index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left-long"></i> Back to Dashboard
      </a>
    </div>
  </header>

  <div class="container-fluid mt-4">
    
    <div class="row">
      <div class="col-md-8">
        <div class="simulation-container">
          <div class="canvas-wrapper">
            <canvas id="graphCanvas" width="800" height="400"></canvas>
          </div>
          <div class="controls-panel">
            <div class="control-group">
              <label for="algorithm">Algorithm:</label>
              <select id="algorithm">
                <option value="bfs">Breadth-First Search (BFS)</option>
                <option value="dfs">Depth-First Search (DFS)</option>
                <option value="dijkstra">Dijkstra\'s Algorithm</option>
              </select>
            </div>
            <div class="control-group">
              <label for="startNode">Start Node:</label>
              <input type="number" id="startNode" min="0" max="9" value="0">
            </div>
            <div class="control-group">
              <label for="speed">Speed:</label>
              <input type="range" id="speed" min="1" max="10" value="5">
            </div>
            <button class="btn btn-primary" id="startBtn">Start Algorithm</button>
            <button class="btn btn-outline-secondary" id="resetBtn">Reset</button>
            <button class="btn btn-outline-secondary" id="newGraphBtn">New Graph</button>
          </div>
          <div class="ai-panel">
            <h3>AI Assistant</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Ask for a hint...">
              <button class="btn btn-success" id="sendBtn">Send</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <h5>Graph Info</h5>
          <div id="graphInfo">
            <p>Currently displaying: Undirected, Unweighted Graph</p>
          </div>
        </div>
        <div class="card mt-3">
          <h5>Steps</h5>
          <div id="stepsInfo">
            <p>Visited: --</p>
            <p>Queue/Stack: --</p>
            <p>Distances: --</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/visualizer-core.js"></script>
  <script src="../../assets/js/ai-assistant.js"></script>
  <script>
    // Initialize the visualizer and AI assistant
    const visualizer = new window.visualizer.ArrayVisualizer('graphCanvas'); // We'll use a custom drawing approach
    const aiAssistant = new window.AIAssistant();
    
    // UI elements
    const algorithmSelect = document.getElementById('algorithm');
    const startNodeInput = document.getElementById('startNode');
    const speedInput = document.getElementById('speed');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const newGraphBtn = document.getElementById('newGraphBtn');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const graphInfo = document.getElementById('graphInfo');
    const stepsInfo = document.getElementById('stepsInfo');
    
    // Graph data (adjacency list)
    let graph = [];
    let visited = [];
    let queue = [];
    let stack = [];
    let distances = [];
    let currentAlgorithm = 'bfs';
    
    // Initialize a sample graph
    function initGraph() {
      // Create a simple undirected graph with 6 nodes
      graph = [
        [1, 2],    // Node 0
        [0, 3, 4], // Node 1
        [0, 5],    // Node 2
        [1],       // Node 3
        [1, 5],    // Node 4
        [2, 4]     // Node 5
      ];
      resetState();
      updateGraphInfo();
    }
    
    function resetState() {
      visited = new Array(graph.length).fill(false);
      queue = [];
      stack = [];
      distances = new Array(graph.length).fill(Infinity);
      if (graph.length > 0) {
        const startNode = parseInt(startNodeInput.value);
        distances[startNode] = 0;
      }
    }
    
    function updateGraphInfo() {
      graphInfo.textContent = `Currently displaying: Undirected, Unweighted Graph (${graph.length} nodes)`;
      stepsInfo.innerHTML = window.DOMPurify ? DOMPurify.sanitize(`) : `
        <p>Visited: ${visited.map((v, i) => v ? i : '').filter(n => n !== '').join(', ') || 'None'}</p>
        <p>Queue: ${queue.join(', ') || 'Empty'}</p>
        <p>Stack: ${stack.join(', ') || 'Empty'}</p>
        <p>Distances: ${distances.map((d, i) => d === Infinity ? '8' : d).join(', ')}</p>
      `;
    }
    
    // Event listeners
    startBtn.addEventListener('click', startAlgorithm);
    resetBtn.addEventListener('click', resetAlgorithm);
    newGraphBtn.addEventListener('click', () => {
      initGraph();
      resetAlgorithm();
    });
    algorithmSelect.addEventListener('change', () => {
      currentAlgorithm = algorithmSelect.value;
      resetAlgorithm();
    });
    startNodeInput.addEventListener('change', () => {
      resetAlgorithm();
    });
    
    // Initialize
    initGraph();
    
    function startAlgorithm() {
      // Disable controls during execution
      startBtn.disabled = true;
      resetBtn.disabled = true;
      newGraphBtn.disabled = true;
      
      // Reset state
      resetState();
      
      // Start the selected algorithm
      switch (currentAlgorithm) {
        case 'bfs':
          executeBFS();
          break;
        case 'dfs':
          executeDFS();
          break;
        case 'dijkstra':
          executeDijkstra();
          break;
      }
    }
    
    function resetAlgorithm() {
      startBtn.disabled = false;
      resetBtn.disabled = false;
      newGraphBtn.disabled = false;
      resetState();
      updateGraphInfo();
      // Clear visualizer highlights
      visualizer.clearHighlights();
    }
    
    async function executeBFS() {
      const startNode = parseInt(startNodeInput.value);
      if (startNode < 0 || startNode >= graph.length) return;
      
      queue.push(startNode);
      visited[startNode] = true;
      distances[startNode] = 0;
      
      while (queue.length > 0) {
        const node = queue.shift();
        // Highlight current node
        visualizer.highlight(node, '#ff9f1c');
        if (window.simAudio) window.simAudio.playTone(node, Array.from({length: graph.length}, (_, i) => i));
        await sleep(1000 / parseInt(speedInput.value));
        
        // Process neighbors
        for (const neighbor of graph[node]) {
          if (!visited[neighbor]) {
            visited[neighbor] = true;
            distances[neighbor] = distances[node] + 1;
            queue.push(neighbor);
            // Highlight neighbor as discovered
            visualizer.highlight(neighbor, '#4cc9f0');
          }
        }
        
        // Clear current node highlight after processing
        visualizer.unhighlight(node);
        updateGraphInfo();
      }
      
      // Play completion sweep
      if (window.simAudio) window.simAudio.playSweep(Array.from({length: graph.length}, (_, i) => i));

      // Re-enable controls
      startBtn.disabled = false;
      resetBtn.disabled = false;
      newGraphBtn.disabled = false;
    }
    
    async function executeDFS() {
      const startNode = parseInt(startNodeInput.value);
      if (startNode < 0 || startNode >= graph.length) return;
      
      stack.push(startNode);
      
      while (stack.length > 0) {
        const node = stack.pop();
        if (!visited[node]) {
          visited[node] = true;
          // Highlight current node
          visualizer.highlight(node, '#ff9f1c');
          if (window.simAudio) window.simAudio.playTone(node, Array.from({length: graph.length}, (_, i) => i));
          await sleep(1000 / parseInt(speedInput.value));
          
          // Process neighbors (in reverse order to match typical DFS)
          for (let i = graph[node].length - 1; i >= 0; i--) {
            const neighbor = graph[node][i];
            if (!visited[neighbor]) {
              stack.push(neighbor);
              // Highlight neighbor as discovered
              visualizer.highlight(neighbor, '#4cc9f0');
            }
          }
          
          // Clear current node highlight after processing
          visualizer.unhighlight(node);
          updateGraphInfo();
        }
      }
      
      // Play completion sweep
      if (window.simAudio) window.simAudio.playSweep(Array.from({length: graph.length}, (_, i) => i));

      // Re-enable controls
      startBtn.disabled = false;
      resetBtn.disabled = false;
      newGraphBtn.disabled = false;
    }
    
    async function executeDijkstra() {
      const startNode = parseInt(startNodeInput.value);
      if (startNode < 0 || startNode >= graph.length) return;
      
      // Initialize distances
      distances = new Array(graph.length).fill(Infinity);
      distances[startNode] = 0;
      visited = new Array(graph.length).fill(false);
      
      // Priority queue (simplified as array sort)
      let pq = [[0, startNode]]; // [distance, node]
      
      while (pq.length > 0) {
        // Sort by distance
        pq.sort((a, b) => a[0] - b[0]);
        const [dist, node] = pq.shift();
        
        if (visited[node]) continue;
        visited[node] = true;
        
        // Highlight current node
        visualizer.highlight(node, '#ff9f1c');
        if (window.simAudio) window.simAudio.playTone(node, Array.from({length: graph.length}, (_, i) => i));
        await sleep(1000 / parseInt(speedInput.value));
        
        // Process neighbors
        for (const neighbor of graph[node]) {
          const alt = dist + 1; // Assuming unweighted graph (weight = 1)
          if (alt < distances[neighbor]) {
            distances[neighbor] = alt;
            pq.push([alt, neighbor]);
          }
        }
        
        // Clear current node highlight after processing
        visualizer.unhighlight(node);
        updateGraphInfo();
      }
      
      // Play completion sweep
      if (window.simAudio) window.simAudio.playSweep(Array.from({length: graph.length}, (_, i) => i));

      // Re-enable controls
      startBtn.disabled = false;
      resetBtn.disabled = false;
      newGraphBtn.disabled = false;
    }
    
    // Helper function for sleep
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // AI Assistant UI
    sendBtn.addEventListener('click', async () => {
      const message = userInput.value.trim();
      if (message) {
        // Add user message to chat
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        messageDiv.textContent = message;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Get AI response (placeholder)
        const response = await aiAssistant.getHint({ 
          algorithm: currentAlgorithm.toLowerCase(),
          action: 'execute'
        });
        
        // Add AI message to chat
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        aiMessageDiv.textContent = response;
        chatMessages.appendChild(aiMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Clear input
        userInput.value = '';
      }
    });
    
    // Allow Enter key to send message
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });
  </script>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script src="../../assets/js/sim-audio.js"></script>
</body>
</html>
