<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Data Structures - DSA Practical Guide</title>
  <link href="../../assets/css/main.css" rel="stylesheet">
  <link href="../../assets/css/simulation-base.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <header class="mb-4">
      <h1>Recursive Data Structures</h1>
      <p>Visualize and understand trees and heaps</p>
    </header>
    
    <div class="row">
      <div class="col-md-8">
        <div class="simulation-container">
          <div class="canvas-wrapper">
            <canvas id="treeCanvas" width="800" height="400"></canvas>
          </div>
          <div class="controls-panel">
            <div class="control-group">
              <label for="treeType">Tree Type:</label>
              <select id="treeType">
                <option value="bst">Binary Search Tree</option>
                <option value="avl">AVL Tree</option>
                <option value="heap">Max Heap</option>
              </select>
            </div>
            <div class="control-group">
              <label for="value">Value:</label>
              <input type="number" id="value" min="1" max="100" value="42">
            </div>
            <div class="control-group">
              <label for="speed">Speed:</label>
              <input type="range" id="speed" min="1" max="10" value="5">
            </div>
            <button class="btn btn-primary" id="executeBtn">Insert</button>
            <button class="btn btn-outline-secondary" id="resetBtn">Reset</button>
          </div>
          <div class="ai-panel">
            <h3>AI Assistant</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Ask for a hint...">
              <button class="btn btn-success" id="sendBtn">Send</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <h5>Tree Info</h5>
          <div id="treeInfo">
            <p>Currently displaying: Binary Search Tree</p>
          </div>
        </div>
        <div class="card mt-3">
          <h5>Properties</h5>
          <div id="treeProperties">
            <p>Height: --</p>
            <p>Nodes: --</p>
            <p>Balanced: --</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/visualizer-core.js"></script>
  <script src="../../assets/js/ai-assistant.js"></script>
  <script>
    // Initialize the visualizer and AI assistant
    const visualizer = new window.visualizer.TreeVisualizer('treeCanvas');
    const aiAssistant = new window.AIAssistant();
    
    // UI elements
    const treeTypeSelect = document.getElementById('treeType');
    const valueInput = document.getElementById('value');
    const speedInput = document.getElementById('speed');
    const executeBtn = document.getElementById('executeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const treeInfo = document.getElementById('treeInfo');
    const treeProperties = document.getElementById('treeProperties');
    
    // Tree data
    let treeRoot = null;
    let treeType = 'bst';
    
    // Update visualizer with tree
    function updateVisualizer() {
      visualizer.setRoot(treeRoot);
    }
    
    // Event listeners
    executeBtn.addEventListener('click', insertValue);
    resetBtn.addEventListener('click', resetTree);
    treeTypeSelect.addEventListener('change', () => {
      treeType = treeTypeSelect.value;
      resetTree();
    });
    
    // Initialize
    resetTree();
    
    function resetTree() {
      treeRoot = null;
      updateVisualizer();
      treeInfo.textContent = `Currently displaying: ${treeType.toUpperCase()} (Empty)`;
      treeProperties.innerHTML = '<p>Height: 0</p><p>Nodes: 0</p><p>Balanced: Yes</p>';
    }
    
    function insertValue() {
      const value = parseInt(valueInput.value);
      if (isNaN(value)) {
        alert('Please enter a valid number');
        return;
      }
      
      switch (treeType) {
        case 'bst':
          treeRoot = insertIntoBST(treeRoot, value);
          break;
        case 'avl':
          // Simplified AVL - just BST for visualization
          treeRoot = insertIntoBST(treeRoot, value);
          break;
        case 'heap':
          // For heap, we'll just add to array and rebuild (simplified)
          // In a real implementation, we'd maintain heap property
          break;
      }
      
      updateVisualizer();
      updateTreeInfo();
    }
    
    function insertIntoBST(root, value) {
      if (root === null) {
        return { value, left: null, right: null };
      }
      
      if (value < root.value) {
        root.left = insertIntoBST(root.left, value);
      } else if (value > root.value) {
        root.right = insertIntoBST(root.right, value);
      }
      // If equal, we don't insert duplicates (or we could, but let's not for simplicity)
      
      return root;
    }
    
    function updateTreeInfo() {
      // Calculate tree properties (simplified)
      const height = getTreeHeight(treeRoot);
      const nodes = countTreeNodes(treeRoot);
      const isBalanced = Math.abs(getTreeHeight(treeRoot.left || null) - getTreeHeight(treeRoot.right || null)) <= 1;
      
      treeInfo.textContent = `Currently displaying: ${treeType.toUpperCase()} (${nodes} nodes)`;
      treeProperties.innerHTML = `
        <p>Height: ${height}</p>
        <p>Nodes: ${nodes}</p>
        <p>Balanced: ${isBalanced ? 'Yes' : 'No'}</p>
      `;
    }
    
    function getTreeHeight(node) {
      if (node === null) return 0;
      return 1 + Math.max(getTreeHeight(node.left), getTreeHeight(node.right));
    }
    
    function countTreeNodes(node) {
      if (node === null) return 0;
      return 1 + countTreeNodes(node.left) + countTreeNodes(node.right);
    }
    
    // AI Assistant UI
    sendBtn.addEventListener('click', async () => {
      const message = userInput.value.trim();
      if (message) {
        // Add user message to chat
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        messageDiv.textContent = message;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Get AI response (placeholder)
        const response = await aiAssistant.getHint({ 
          algorithm: treeType,
          action: 'insert'
        });
        
        // Add AI message to chat
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        aiMessageDiv.textContent = response;
        chatMessages.appendChild(aiMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Clear input
        userInput.value = '';
      }
    });
    
    // Allow Enter key to send message
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
