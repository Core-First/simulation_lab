name: Secure Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:

  #########################################################################
  # LOW-CODE / QUALITY ANALYSIS
  #########################################################################

  quality-analysis:
    name: Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #####################################################################
      # SETUP
      #####################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      #####################################################################
      # INSTALL TOOLS
      #####################################################################

      - name: Install Python Tools
        run: |
          pip install \
            lizard \
            radon

      - name: Install Node Tools
        run: |
          npm install -g \
            jscpd \
            eslint

      #####################################################################
      # JSCPD
      #####################################################################

      - name: Duplication Scan
        continue-on-error: true
        run: |
          jscpd . \
            --min-lines 5 \
            --min-tokens 50 \
            --reporters json \
            --output ./jscpd-report

      #####################################################################
      # LIZARD
      #####################################################################

      - name: Complexity Scan
        continue-on-error: true
        run: |
          lizard . > lizard-report.txt

      #####################################################################
      # RADON
      #####################################################################

      - name: Maintainability Scan
        continue-on-error: true
        run: |
          radon cc . -j > radon-report.json

      #####################################################################
      # ESLINT
      #####################################################################

      - name: Run ESLint
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            eslint .
          fi

      #####################################################################
      # CUSTOM LOW-CODE DETECTOR
      #####################################################################

      - name: Run Low-Code Detector
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          python low_code_detector.py

      #####################################################################
      # ARTIFACTS
      #####################################################################

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            low-code-report.txt
            lizard-report.txt
            radon-report.json
            jscpd-report/

      #####################################################################
      # COMMENT ON PR
      #####################################################################

      - name: Publish PR Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const report = fs.readFileSync(
              'low-code-report.txt',
              'utf8'
            );

            const comments =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

            const existing = comments.data.find(
              c =>
                c.user.type === 'Bot' &&
                c.body.includes('LOW-CODE ANALYSIS')
            );

            const body =
              '## LOW-CODE ANALYSIS\n\n' +
              report;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      #####################################################################
      # BLOCK HIGH-RISK MERGES
      #####################################################################

      - name: Fail High Risk Contributions
        run: |
          SCORE=$(grep "Risk Score" low-code-report.txt | awk '{print $3}' | tr -d '%')

          echo "Risk Score = $SCORE"

          if [ "$SCORE" -gt 70 ]; then
            echo "High-risk contribution detected."
            exit 1
          fi

  #########################################################################
  # GITLEAKS SECRET SCAN
  #########################################################################

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #########################################################################
  # SEMGREP
  #########################################################################

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --config=.semgrep/custom-rules.yml \
            --severity ERROR \
            --json \
            --output=semgrep-report.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json



  #########################################################################
  # DEPENDENCY AUDIT
  #########################################################################

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #####################################################################
      # NODE SECURITY AUDIT
      #####################################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm ci
            npm audit --audit-level=high
          fi

      #####################################################################
      # PYTHON SECURITY AUDIT
      #####################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run pip audit
        run: |
          pip install pip-audit

          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          fi

      - name: Run Sentinel Scanner
        run: |
          pip install sentinel-scanner
          sentinel-scanner .
