name: Deploy All Files to GitHub Pages

on:
  push:
    branches: [ main ]    
  pull_request:            
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare deployment directory
        run: |
          mkdir -p /tmp/deploy
          rsync -av --exclude='public/' --exclude='.git/' --exclude='node_modules/' --exclude='.github/' --exclude='*.md' . /tmp/deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
