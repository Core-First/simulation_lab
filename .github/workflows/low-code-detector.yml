name: Low-Code Detector

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  detect-low-code:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Analysis Tools
        run: |
          pip install lizard
          npm install -g jscpd

      - name: Run Duplication Scan
        run: |
          jscpd . \
            --min-lines 5 \
            --min-tokens 50 \
            --reporters json \
            --output ./jscpd-report || true

      - name: Run Complexity Scan
        run: |
          lizard . > lizard-report.txt || true

      - name: Run Low-Code Detector
        run: |
          python low_code_detector.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: low-code-report
          path: |
            low-code-report.txt
            jscpd-report/
            lizard-report.txt

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('low-code-report.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Fail if Risk Too High
        run: |
          SCORE=$(grep "Risk Score" low-code-report.txt | awk '{print $4}' | tr -d '%')

          echo "Risk Score: $SCORE"

          if [ "$SCORE" -gt 70 ]; then
            echo "Low-quality AI/boilerplate code suspected."
            exit 1
          fi