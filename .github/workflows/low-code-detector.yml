name: Secure Low-Code Detector

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  # -----------------------------------
  # LOW-CODE ANALYSIS
  # -----------------------------------

  low-code-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Analysis Tools
        run: |
          pip install lizard
          npm install -g jscpd

      - name: Run Duplication Scan
        run: |
          jscpd . \
            --min-lines 5 \
            --min-tokens 50 \
            --reporters json \
            --output ./jscpd-report || true

      - name: Run Complexity Scan
        run: |
          lizard . > lizard-report.txt || true

      - name: Run Low-Code Detector
        run: |
          python low_code_detector.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: low-code-report
          path: |
            low-code-report.txt
            jscpd-report/
            lizard-report.txt

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('low-code-report.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Fail if Risk Too High
        run: |
          SCORE=$(grep "Risk Score" low-code-report.txt | awk '{print $4}' | tr -d '%')

          echo "Risk Score: $SCORE"

          if [ "$SCORE" -gt 70 ]; then
            echo "High-risk low-quality contribution detected."
            exit 1
          fi

  # -----------------------------------
  # SEMGREP SECURITY SCAN
  # -----------------------------------

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --json \
            --output=semgrep-report.json

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  # -----------------------------------
  # CODEQL ANALYSIS
  # -----------------------------------

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
