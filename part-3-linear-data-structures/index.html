<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Data Structures - DSA Practical Guide</title>
  <link href="../../assets/css/main.css" rel="stylesheet">
  <link href="../../assets/css/simulation-base.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <header class="mb-4">
      <h1>Linear Data Structures</h1>
      <p>Visualize and understand linked lists, stacks, and queues</p>
    </header>
    
    <div class="row">
      <div class="col-md-8">
        <div class="simulation-container">
          <div class="canvas-wrapper">
            <canvas id="linkedListCanvas" width="800" height="400"></canvas>
          </div>
          <div class="controls-panel">
            <div class="control-group">
              <label for="operation">Operation:</label>
              <select id="operation">
                <option value="insertAtHead">Insert at Head</option>
                <option value="insertAtTail">Insert at Tail</option>
                <option value="deleteHead">Delete Head</option>
                <option value="deleteTail">Delete Tail</option>
                <option value="search">Search</option>
              </select>
            </div>
            <div class="control-group">
              <label for="value">Value:</label>
              <input type="number" id="value" min="1" max="100" value="42">
            </div>
            <div class="control-group">
              <label for="speed">Speed:</label>
              <input type="range" id="speed" min="1" max="10" value="5">
            </div>
            <button class="btn btn-primary" id="executeBtn">Execute</button>
            <button class="btn btn-outline-secondary" id="resetBtn">Reset</button>
          </div>
          <div class="ai-panel">
            <h3>AI Assistant</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Ask for a hint...">
              <button class="btn btn-success" id="sendBtn">Send</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <h5>Data Structure Info</h5>
          <div id="structureInfo">
            <p>Currently displaying: Singly Linked List</p>
          </div>
        </div>
        <div class="card mt-3">
          <h5>Operations</h5>
          <div id="operationsInfo">
            <p>Insert at Head: O(1)</p>
            <p>Insert at Tail: O(n)</p>
            <p>Delete Head: O(1)</p>
            <p>Delete Tail: O(n)</p>
            <p>Search: O(n)</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/visualizer-core.js"></script>
  <script src="../../assets/js/ai-assistant.js"></script>
  <script>
    // Initialize the visualizer and AI assistant
    const visualizer = new window.visualizer.ArrayVisualizer('linkedListCanvas'); // We'll use array to represent list visually
    const aiAssistant = new window.AIAssistant();
    
    // UI elements
    const operationSelect = document.getElementById('operation');
    const valueInput = document.getElementById('value');
    const speedInput = document.getElementById('speed');
    const executeBtn = document.getElementById('executeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const structureInfo = document.getElementById('structureInfo');
    const operationsInfo = document.getElementById('operationsInfo');
    
    // Linked list representation (for visualization)
    let linkedList = [];
    
    // Update visualizer with linked list array
    function updateVisualizer() {
      visualizer.setArray(linkedList);
      // Clear highlights
      visualizer.clearHighlights();
    }
    
    // Event listeners
    executeBtn.addEventListener('click', executeOperation);
    resetBtn.addEventListener('click', resetList);
    
    // Initialize
    resetList();
    
    function resetList() {
      linkedList = [];
      updateVisualizer();
      structureInfo.textContent = 'Currently displaying: Singly Linked List (Empty)';
    }
    
    function executeOperation() {
      const operation = operationSelect.value;
      const value = parseInt(valueInput.value);
      
      if (isNaN(value)) {
        alert('Please enter a valid number');
        return;
      }
      
      switch (operation) {
        case 'insertAtHead':
          linkedList.unshift(value);
          break;
        case 'insertAtTail':
          linkedList.push(value);
          break;
        case 'deleteHead':
          if (linkedList.length > 0) linkedList.shift();
          break;
        case 'deleteTail':
          if (linkedList.length > 0) linkedList.pop();
          break;
        case 'search':
          const index = linkedList.indexOf(value);
          if (index !== -1) {
            visualizer.highlight(index, '#4ade80'); // Green for found
          } else {
            // Flash red for not found
            visualizer.clearHighlights();
            setTimeout(() => visualizer.clearHighlights(), 500);
          }
          break;
      }
      
      updateVisualizer();
      
      // Update structure info
      structureInfo.textContent = `Singly Linked List: ${linkedList.length} nodes`;
    }
    
    // AI Assistant UI
    sendBtn.addEventListener('click', async () => {
      const message = userInput.value.trim();
      if (message) {
        // Add user message to chat
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        messageDiv.textContent = message;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Get AI response (placeholder)
        const response = await aiAssistant.getHint({ 
          algorithm: 'linkedList', 
          operation: operationSelect.value 
        });
        
        // Add AI message to chat
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        aiMessageDiv.textContent = response;
        chatMessages.appendChild(aiMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Clear input
        userInput.value = '';
      }
    });
    
    // Allow Enter key to send message
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
