rules:

  - id: dangerous-eval
    patterns:
      - pattern: eval(...)
    message: Dangerous eval usage detected
    severity: ERROR
    languages:
      - javascript
      - typescript

  - id: hardcoded-secret
    patterns:
      - pattern-regex: '(API_KEY|SECRET|TOKEN)\s*=\s*["''][A-Za-z0-9_\-]{16,}["'']'
    message: Possible hardcoded secret
    severity: ERROR
    languages:
      - python
      - javascript
      - typescript

  - id: insecure-random
    patterns:
      - pattern: Math.random(...)
    message: Insecure randomness usage
    severity: WARNING
    languages:
      - javascript
